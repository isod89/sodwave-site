<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0c0d">
<meta name="description" content="Kraken: a free DAW with the real SLOOP and Clipper engines, by Sodwave.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Kraken">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/kraken-icon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{height:100%}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kraken</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Silkscreen&display=swap">
<style>
/* Layout: an aluminium chassis (header, rails, labels) framing black displays (timeline,
   editors, LCDs) where every track keeps its colour, as on the FM-1 running SLOOP / Clipper. */
:root {
  --chassis: #d6d7d4; --chassis-hi: #e7e8e5; --chassis-lo: #bfc1be; --edge: #a9aca9;
  --ink: #131415; --ink-2: #55595c; --ink-3: #868a8c;
  --screen: #0b0c0d; --screen-2: #131517; --screen-3: #1b1e21; --line: #23272b; --line-2: #2f343a;
  --text: #dfe2de; --dim: #737980;
  --accent: #ff5b14; --accent-ink: #1a0b03; --rec: #ff2f2f; --go: #19b765; --warn: #ffc21a;
  --f-ui: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --f-lcd: 'Silkscreen', 'IBM Plex Mono', ui-monospace, monospace;
  --r: 6px;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--chassis); color: var(--ink); font: 500 12px/1.3 var(--f-ui);
  overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
canvas { display: block; }

#app {
  height: 100%; box-sizing: border-box; display: grid; gap: 8px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  grid-template-columns: minmax(0, 1fr) 248px;
  grid-template-rows: auto minmax(120px, 1fr) var(--bottom-h, 300px);
  grid-template-areas: "top top" "arr lib" "bot lib";
}
#app.no-lib { grid-template-columns: minmax(0, 1fr) 0; }
#app.no-lib #lib { display: none; }

/* ---------------------------------------------------------------- top rail */
#top { grid-area: top; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.logo { font: 400 20px/1 var(--f-lcd); letter-spacing: 0.04em; display: flex; align-items: baseline; gap: 6px; padding-right: 4px; }
.logo small { font: 600 9px/1 var(--f-ui); letter-spacing: 0.14em; color: var(--ink-2); text-transform: uppercase; }
.group { display: flex; align-items: center; gap: 4px; }
.sep { width: 1px; align-self: stretch; background: var(--edge); margin: 2px 2px; }
.key {
  height: 34px; min-width: 34px; padding: 0 9px; border-radius: var(--r); border: 1px solid var(--edge);
  background: linear-gradient(var(--chassis-hi), var(--chassis)); box-shadow: 0 1px 0 #fff8 inset, 0 1px 1px #0002;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: 700 10px/1 var(--f-ui); letter-spacing: 0.1em; text-transform: uppercase;
}
.key:hover { background: var(--chassis-hi); }
.key:active { transform: translateY(1px); box-shadow: none; }
.key.on { background: var(--ink); color: var(--chassis-hi); border-color: var(--ink); }
#autobtn.on { color: #ff6a3d; }
#top .fit-hide { display: none !important; }
.head.kid { box-shadow: inset calc(var(--depth, 1) * 6px) 0 0 #ffffff0a; padding-left: calc(10px + var(--depth, 1) * 8px); }
.head.vca .chip { border-radius: 50%; }
.head.grp { padding-left: 20px; }
.head .tb.fold { position: absolute; left: 6px; top: 7px; width: 14px; height: 16px; padding: 0; font-size: 9px; }
.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin: 6px 0 10px; }
.swatch { aspect-ratio: 1; border-radius: 5px; border: 2px solid transparent; cursor: pointer; }
.swatch.on { border-color: var(--text); }
.strip .vca-info { white-space: pre-line; text-align: center; font: 700 9px/1.6 var(--f-ui); letter-spacing: 0.12em; color: var(--dim); align-content: center; }
.strip .vca-tag { font: 600 8px/1 var(--f-ui); letter-spacing: 0.1em; color: var(--dim); display: grid; place-items: center; }
.key.round { border-radius: 50%; width: 38px; height: 38px; padding: 0; }
.key.icon { font-size: 15px; padding: 0; width: 34px; }
#countin, #punch, #click, #loop { padding: 0 7px; }
.key svg { width: 14px; height: 14px; }
#play.on { background: var(--go); border-color: #0d8f4c; color: #fff; }
#rec.on { background: var(--rec); border-color: #b51717; color: #fff; }
#rec svg circle { fill: var(--rec); }
#rec.on svg circle { fill: #fff; }
.lcd {
  background: var(--screen); color: var(--text); border-radius: var(--r); height: 38px; padding: 0 12px;
  display: flex; align-items: center; gap: 14px; box-shadow: 0 0 0 1px #0006 inset; font-variant-numeric: tabular-nums;
}
.lcd .big { font: 400 20px/1 var(--f-lcd); color: var(--accent); min-width: 6.4em; }
.lcd .cell { display: grid; gap: 2px; }
.lcd .cell b { font: 600 8px/1 var(--f-ui); letter-spacing: 0.16em; color: var(--dim); text-transform: uppercase; }
.lcd .cell span, .lcd input { font: 500 13px/1 var(--f-mono); color: var(--text); }
#lufs { display: inline-block; min-width: 9.6em; font-variant-numeric: tabular-nums; }
.lcd input { width: 4.2em; background: transparent; border: 0; padding: 0; outline: none; cursor: ns-resize; }
.lcd input:focus { color: var(--accent); cursor: text; }
.lcd select { background: var(--screen); border: 0; color: var(--text); font: 500 12px/1 var(--f-mono); padding: 0; }
.meter-h { width: 70px; height: 10px; display: grid; gap: 2px; }
.meter-h i { display: block; height: 4px; background: var(--line-2); position: relative; overflow: hidden; border-radius: 1px; }
.meter-h i::after { content: ""; position: absolute; inset: 0; transform-origin: left; transform: scaleX(var(--v, 0));
  background: linear-gradient(90deg, var(--go) 0 70%, var(--warn) 70% 88%, var(--rec) 88%); }
.spacer { flex: 1; }
.title-field {
  max-width: 9em;
  background: transparent; border: 0; border-bottom: 1px dashed var(--edge); font: 700 13px/1 var(--f-ui);
  font-stretch: 85%; letter-spacing: 0.04em; text-transform: uppercase; width: 10em; padding: 4px 0; outline: none;
}
.menu { position: relative; }
.menu-list {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 50; min-width: 210px; background: var(--screen);
  color: var(--text); border-radius: var(--r); padding: 6px; box-shadow: 0 10px 30px #0005; display: grid;
}
.menu-list button { text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 4px;
  font: 600 11px/1 var(--f-ui); letter-spacing: 0.08em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 16px; }
.menu-list button:hover { background: var(--screen-3); color: var(--accent); }
.menu-list kbd { font: 500 10px/1 var(--f-mono); color: var(--dim); }
.menu-list hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.menu-list.pop { position: fixed; right: auto; z-index: 120; overflow-y: auto; }
#lanes canvas, #ruler, .ecanvas, #heads, .smp-wave { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.head.drop { box-shadow: 0 -2px 0 var(--accent) inset, 0 2px 0 var(--accent); }
@media (pointer: coarse) { #arr { grid-template-rows: 52px minmax(0, 1fr); } }
.sm { display: none; }
.phone-only { display: none !important; }
.sheet { display: grid; gap: 6px; }
.sheet .add { height: 44px; font-size: 11px; justify-content: center; }
.sheet .add.danger { background: var(--rec); border-color: var(--rec); color: #fff; }

/* ------------------------------------------------------------ arrangement */
.panel { background: var(--screen); border-radius: 10px; color: var(--text); min-width: 0; min-height: 0; overflow: hidden;
  box-shadow: 0 0 0 1px #0007, 0 1px 0 #fff9; position: relative; }
#arr { grid-area: arr; display: grid; grid-template-columns: 228px minmax(0, 1fr); grid-template-rows: 40px minmax(0, 1fr); }
#arr-corner { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); display: flex; align-items: center; gap: 3px; padding: 0 5px; overflow: hidden; }
#arr-corner .add { padding: 0 5px; }
.add {
  height: 20px; padding: 0 7px; border-radius: 4px; background: var(--screen-3); border: 1px solid var(--line-2); color: var(--text);
  font: 700 9px/1 var(--f-ui); letter-spacing: 0.12em; text-transform: uppercase;
}
.add:hover { border-color: var(--accent); color: var(--accent); }
#ruler { border-bottom: 1px solid var(--line); cursor: text; }
#heads { overflow: hidden; border-right: 1px solid var(--line); position: relative; }
#heads-inner { position: absolute; left: 0; right: 0; top: 0; }
#lanes { position: relative; min-width: 0; }
#lanes canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#ruler { width: 100%; height: 100%; }
.head {
  height: var(--h); box-sizing: border-box; border-bottom: 1px solid var(--line); display: grid;
  grid-template-columns: 4px minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 8px; row-gap: 5px;
  padding: 8px 6px 6px 0; align-content: start; position: relative; overflow: hidden;
}
.head.sel { background: var(--screen-2); }
.head .chip { grid-row: 1 / 3; background: var(--c); border-radius: 0 2px 2px 0; }
.head .name { font: 700 11px/1.1 var(--f-ui); font-stretch: 88%; letter-spacing: 0.06em; text-transform: uppercase;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; outline: none; border-radius: 2px; }
.head .name[contenteditable="true"] { background: var(--screen-3); }
.head .snd { grid-column: 2 / 3; font: 500 10px/1 var(--f-mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head .btns { grid-row: 1 / 3; grid-column: 3; display: grid; grid-template-columns: repeat(3, 20px); grid-auto-flow: column; grid-template-rows: 18px 18px; gap: 3px; align-content: start; }
.tb.x:hover { color: #fff; background: var(--rec); border-color: var(--rec); }
.modal .add.go.danger { background: var(--rec); border-color: var(--rec); color: #fff; }
.tb {
  width: 20px; height: 18px; border-radius: 3px; border: 1px solid var(--line-2); background: var(--screen-3);
  font: 700 9px/1 var(--f-ui); color: var(--dim); padding: 0;
}
.tb:hover { color: var(--text); }
.tb.m.on { background: var(--warn); color: #000; border-color: var(--warn); }
.tb.s.on { background: var(--go); color: #000; border-color: var(--go); }
.tb.r.on { background: var(--rec); color: #fff; border-color: var(--rec); }
.tb.a.on { background: var(--c); color: #000; border-color: var(--c); }
.head .meter { position: absolute; right: 0; top: 0; bottom: 0; width: 3px; background: var(--line); }
.head .meter i { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--v, 0) * 100%); background: var(--c); opacity: 0.9; }
.auto-head { height: var(--ah); box-sizing: border-box; border-bottom: 1px solid var(--line); padding: 6px 8px 6px 10px; display: grid; gap: 4px; align-content: start; background: #0e1011; }
.auto-head select { background: var(--screen-3); color: var(--text); border: 1px solid var(--line-2); border-radius: 3px; font: 500 10px/1 var(--f-mono); padding: 3px; }
.auto-head small { font: 500 9px/1.3 var(--f-ui); color: var(--dim); letter-spacing: 0.04em; }

/* ------------------------------------------------------------ bottom deck */
#bot { grid-area: bot; display: grid; grid-template-rows: 30px minmax(0, 1fr); }
#resize { position: absolute; top: 0; left: 0; right: 0; height: 7px; cursor: ns-resize; z-index: 5; touch-action: none; }
#resize::after { content: ""; position: absolute; left: 50%; top: 2px; width: 44px; height: 3px; margin-left: -22px; border-radius: 2px; background: var(--line-2); }
#resize:hover::after { background: var(--accent); }
.tabs { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); gap: 0; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tab {
  background: none; border: 0; border-right: 1px solid var(--line); padding: 0 14px; color: var(--dim);
  font: 700 10px/1 var(--f-ui); letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap;
}
.tab.on { color: var(--text); background: var(--screen-2); box-shadow: 0 -2px 0 var(--accent) inset; }
.tab-info { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 0 10px; font: 500 10px/1 var(--f-mono); color: var(--dim); white-space: nowrap; }
.tab-info .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--dim)); }
.view { min-height: 0; min-width: 0; position: relative; overflow: hidden; }
.view[hidden] { display: none; }

/* editor bar */
.ebar { position: absolute; top: 0; left: 0; right: 0; height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 8px;
  border-bottom: 1px solid var(--line); background: var(--screen-2); overflow-x: auto; scrollbar-width: none; }
.ebar label { display: flex; align-items: center; gap: 5px; font: 700 9px/1 var(--f-ui); letter-spacing: 0.12em; color: var(--dim); text-transform: uppercase; white-space: nowrap; }
.ebar select, .ebar input { background: var(--screen-3); color: var(--text); border: 1px solid var(--line-2); border-radius: 3px; font: 500 11px/1 var(--f-mono); padding: 3px 4px; }
.ebar input { width: 4em; }
.ebar .add { height: 22px; }
.ebar .add.on { border-color: #ffc21a; color: #ffc21a; }
.split-btn { display: inline-flex; }
.split-btn .add:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.split-btn .add:last-child { border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: 0; padding: 0 6px; }
.qz-dlg { width: min(420px, 94vw); }
.qz-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) 70px; gap: 10px; align-items: center; margin: 8px 0; font: 700 9px/1 var(--f-ui); letter-spacing: 0.12em; color: var(--dim); }
.qz-row b { font: 500 11px/1 var(--f-mono); color: var(--text); text-align: right; }
.qz-row input[type=checkbox] { justify-self: start; }
.ecanvas { position: absolute; top: 30px; left: 0; width: 100%; height: calc(100% - 30px); outline: none; }
/* scroll bars over the views: a thumb to drag, the bar to jump (fingers and mice) */
.sbar { position: absolute; z-index: 4; background: #0b0c0dcc; border-radius: 6px; touch-action: none; cursor: pointer; }
.sbar.h { left: 4px; right: 18px; bottom: 3px; height: 10px; }
.sbar.v { top: 4px; bottom: 18px; right: 3px; width: 10px; }
.sbar i { position: absolute; border-radius: 5px; background: #5b6168; }
.sbar.h i { top: 1px; bottom: 1px; } .sbar.v i { left: 1px; right: 1px; }
.sbar:hover i, .sbar.drag i { background: var(--accent); }
.sbar[hidden] { display: none; }
@media (pointer: coarse) {
  .sbar.h { height: 18px; bottom: 4px; right: 26px; } .sbar.v { width: 18px; right: 4px; bottom: 26px; }
  .sbar i { background: #8a9096; }
}
.empty { position: absolute; inset: 30px 0 0; display: grid; place-content: center; gap: 8px; text-align: center; color: var(--dim); padding: 16px; }
.empty b { font: 400 14px/1.2 var(--f-lcd); color: var(--text); }
.empty p { margin: 0; max-width: 42ch; font: 500 11px/1.5 var(--f-ui); }

/* device */
.device { position: absolute; inset: 0; overflow: auto; padding: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; align-content: flex-start; }
.rack-head { flex: 1 0 100%; display: flex; align-items: center; gap: 10px; font: 700 9px/1 var(--f-ui); letter-spacing: 0.2em; color: var(--dim); text-transform: uppercase; }
.rack-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.rack-head em { font-style: normal; color: var(--c, var(--accent)); }
.module { background: var(--screen-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 10px 8px; display: grid; gap: 8px; flex: none; }
.module h4 { margin: 0; font: 700 9px/1 var(--f-ui); letter-spacing: 0.18em; color: var(--dim); text-transform: uppercase; display: flex; justify-content: space-between; gap: 10px; }
.module h4 em { font-style: normal; color: var(--c, var(--accent)); }
.knobs { display: grid; grid-template-columns: repeat(var(--cols, 4), 52px); gap: 8px 6px; }
.knob { display: grid; justify-items: center; gap: 3px; cursor: ns-resize; touch-action: none; }
.knob svg { width: 38px; height: 38px; overflow: visible; }
.knob .lbl { font: 700 8.5px/1 var(--f-ui); letter-spacing: 0.1em; color: var(--dim); text-transform: uppercase; max-width: 52px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.knob .val { font: 500 10px/1 var(--f-mono); color: var(--text); max-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.knob.mod .val { color: var(--c, var(--accent)); }
.sound-lcd { width: 230px; display: grid; gap: 8px; }
.sound-lcd .screen { background: var(--screen); border-radius: 6px; padding: 10px; display: grid; gap: 6px; box-shadow: 0 0 0 1px var(--line) inset; }
.sound-lcd .eng { font: 700 9px/1 var(--f-ui); letter-spacing: 0.18em; color: var(--c); }
.sound-lcd .pre { font: 400 16px/1.15 var(--f-lcd); color: var(--text); word-break: break-word; }
.sound-lcd .row { display: flex; gap: 4px; }
.sound-lcd .row .add { flex: 1; height: 24px; }
.sound-lcd select { width: 100%; background: var(--screen-3); color: var(--text); border: 1px solid var(--line-2); border-radius: 3px; font: 500 11px/1 var(--f-mono); padding: 4px; }
.pads { display: grid; grid-template-columns: repeat(8, 46px); gap: 5px; }
.pad { height: 46px; border-radius: 5px; border: 1px solid var(--line-2); background: var(--screen-3); color: var(--dim);
  font: 700 8px/1 var(--f-ui); letter-spacing: 0.08em; text-transform: uppercase; display: grid; place-items: end start; padding: 5px; }
.pad:active, .pad.hit { background: var(--c); color: #000; }

/* mixer */
.mixer { position: absolute; inset: 0; overflow: auto; min-height: 0; display: flex; gap: 6px; padding: 8px 10px; align-items: stretch; box-sizing: border-box; }
/* a strip: its name; knobs (sends, pan) beside the fader; level, M / S; output, effects. It fits the panel's height. */
.strip { width: 104px; flex: none; background: var(--screen-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px; box-sizing: border-box;
  display: grid; grid-template-columns: 40px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 6px 4px; min-height: 236px; }
.strip .sname { grid-column: 1 / -1; }
.strip .kcol { grid-column: 1; grid-row: 2; display: flex; flex-direction: column; align-items: center; gap: 4px; overflow-y: auto; scrollbar-width: none; min-height: 0; }
.strip > .fader { grid-column: 2; grid-row: 2; min-height: 70px; justify-self: center; }
.strip > .db { grid-column: 1; grid-row: 3; align-self: center; justify-self: center; }
.strip > .ms { grid-column: 2; grid-row: 3; justify-self: center; }
.strip > .out { grid-column: 2; grid-row: 4; }
.strip > .fxb { grid-column: 1; grid-row: 4; }
.strip .kcol .knob .lbl { cursor: pointer; }
.strip.sel { border-color: var(--c); }
.strip .sname { font: 700 10px/1 var(--f-ui); font-stretch: 85%; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text);
  width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-top: 3px solid var(--c); padding-top: 6px; }
.strip .sends { display: contents; }
.strip .out { width: 100%; background: var(--screen-3); color: var(--dim); border: 1px solid var(--line-2); border-radius: 3px; font: 600 8px/1 var(--f-ui); padding: 2px; }
.strip.grp { background: #191c1f; border-style: dashed; }
.strip .sends .knob svg { width: 28px; height: 28px; }
.strip .knobs { grid-template-columns: 34px 34px; }
.fader { display: flex; gap: 6px; min-height: 90px; align-items: stretch; }
.fader .track { width: 24px; position: relative; cursor: ns-resize; touch-action: none; }
.fader .track::before { content: ""; position: absolute; left: 11px; width: 2px; top: 0; bottom: 0; background: var(--line-2); border-radius: 1px; }
.fader .cap { position: absolute; left: 0; width: 24px; height: 12px; margin-top: -6px; border-radius: 3px; background: var(--chassis); box-shadow: 0 1px 0 #fff8 inset, 0 2px 4px #0008; }

    <div class="group">
      <button class="key" id="home" title="Back to start (Home)" aria-label="Back to start" data-learn="act:home"><svg viewBox="0 0 14 14"><path d="M2 2v10M12 2 4 7l8 5z" fill="currentColor" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button class="key round" id="play" title="Play / stop (Space)" aria-label="Play" data-learn="act:playstop"><svg viewBox="0 0 14 14"><path d="M3 1.5 12.5 7 3 12.5z" fill="currentColor"/></svg></button>
      <button class="key round" id="rec" title="Record (R)" aria-label="Record" data-learn="act:record"><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5"/></svg></button>
      <button class="key" id="loop" title="Loop (L)" data-learn="act:loop">LOOP</button>
      <button class="key" id="click" title="Metronome (M)" data-learn="act:click">CLICK</button>
      <button class="key" id="countin" title="Count-in: one bar of click before recording" data-learn="act:countIn">COUNT</button>
      <button class="key hide-s" id="takesbtn" title="Recording in a loop: TAKES on, each pass is a take of its own, to comp in the take lanes; off, the passes add up (overdub). Drum tracks always add up">TAKES</button>
      <button class="key hide-s" id="autobtn" title="Automation recording · READ: it plays · TOUCH: a knob, fader or send you hold while playing is recorded · LATCH: the same, and it keeps its last value after you let go">AUTO</button>
      <button class="key" id="punch" title="Punch in / out: when on, recording only keeps what is played inside the red zone of the ruler (its middle band: drag its ends to move them)" data-learn="act:punch">PUNCH</button>
    </div>
    <div class="lcd">
      <span class="big" id="pos" title="The position (bar . beat . sixteenth)">001.1.1</span>
      <label class="cell" data-learn="bpm"><b>BPM</b><input id="bpm" inputmode="decimal" aria-label="Tempo"></label>
      <button class="cell hide-s sigcell" id="sigbtn" title="Time signature at the playhead: click to change it from this bar"><b>SIG</b><span id="sig">4/4</span></button>
      <label class="cell hide-s" id="snap-cell"><b>SNAP</b><select id="snap" aria-label="Grid">
        <option value="4">BAR</option><option value="1">1/4</option><option value="0.5">1/8</option><option value="0.25" selected>1/16</option><option value="0.125">1/32</option><option value="0">OFF</option>
      </select></label>
      <label class="cell hide-s hide-m" id="swing-cell" data-learn="swing"><b>SWING</b><select id="swing" aria-label="Swing">
        <option value="0">0%</option><option value="0.2">10%</option><option value="0.4">20%</option><option value="0.6">30%</option><option value="0.8">40%</option><option value="1">50%</option>
      </select></label>
      <span class="cell hide-s hide-l" id="oct-cell"><b>KEYS</b><span id="oct">OCT 4</span></span>
      <span class="cell hide-s hide-l" id="midi-cell"><b>MIDI</b><span id="midi">—</span></span>
      <span class="cell hide-xs" id="cpu-cell" title="The output level, and how busy the audio engine is (CPU). Over 80 %: freeze heavy tracks (INSTRUMENT tab > FREEZE TRACK) to lighten it. Red at its end: the master went over 0 dBFS (a click puts it out; the MIXER has the full meters)"><b>OUT · CPU <span id="cpu">—</span></b><span class="meter-h" id="mmeter"><i></i><i></i></span></span>
      <span class="cell hide-s" id="lufs-cell" title="Loudness (EBU R128): momentary · integrated since play"><b>LUFS</b><span id="lufs">—</span></span>
    </div>
    <div class="spacer"></div>
    <div class="group">
      <button class="key" id="install" title="Install Kraken on this device: it then works offline" hidden>INSTALL</button>
      <button class="key" id="learn" title="MIDI Learn: map any control to your controller (Ctrl+L)">LEARN</button>
      <button class="key icon" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo" data-learn="act:undo">↶</button>
      <button class="key icon" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" data-learn="act:redo">↷</button>
      <button class="key" id="libbtn" title="Sound library (B)" data-learn="act:library">SOUNDS</button>
      <div class="menu">
        <button class="key" id="filebtn" aria-haspopup="true" aria-label="Project menu"><span class="lg">PROJECT</span><span class="sm" aria-hidden="true">☰</span></button>
        <div class="menu-list" id="filemenu" hidden>
          <button data-act="transport" class="phone-only">Metronome, count-in, punch…</button>
          <button data-act="rename" class="phone-only">Rename the project</button>
          <button data-act="starter">Start a song in a style…</button>
          <button data-act="new">New empty project</button>
          <button data-act="demo">Open demo song</button>
          <button data-act="open">Open… <kbd>KRAKEN · DAWPROJECT</kbd></button>
          <button data-act="save">Save project <kbd>Ctrl S</kbd></button>
          <button data-act="saveas">Save as… <kbd>Ctrl ⇧ S</kbd></button>
          <button data-act="recover">Earlier versions…</button>
          <button data-act="collab">Play together (live)… <kbd>INVITE · JOIN</kbd></button>
          <button data-act="template">Save as a template…</button>
          <button data-act="presets">My presets… <kbd>EXPORT · IMPORT</kbd></button>
          <hr>
          <button data-act="export">Export audio… <kbd>WAV FLAC MP3 OPUS</kbd></button>
          <button data-act="stems">Export stems…</button>
          <button data-act="midi">Export MIDI</button>
          <button data-act="dawexport">Export DAWproject… <kbd>BITWIG · STUDIO ONE</kbd></button>
          <button data-act="importmidi">Import MIDI file…</button>
          <button data-act="sloop">Open a SLOOP song… <kbd>.SLOOPSONG</kbd></button>
          <hr>
          <button data-act="install">Install the app (offline)</button>
          <button data-act="palette">Command palette <kbd>Ctrl K</kbd></button>
          <button data-act="help">Help <kbd>KEYS · MOUSE · FINGERS</kbd></button>
          <button data-act="tour">Show me around</button>
          <button data-act="check">Check this device</button>
          <button data-act="report">Report a problem…</button>
          <button data-act="lang">Language: English / Français</button>
        </div>
      </div>
    </div>
  </div>

  <section id="arr" class="panel" aria-label="Arrangement">
    <div id="arr-corner">
      <div class="seg" role="tablist" aria-label="View">
        <button class="on" id="mode-arr" title="Arrangement (Tab)"><span class="lg">ARRANGE</span><span class="sm">ARR</span></button>
        <button id="mode-ses" title="Session: clips to launch (Tab)"><span class="lg">SESSION</span><span class="sm">LIVE</span></button>
      </div>
      <button id="livebadge" class="live-badge" hidden>LIVE</button>
      <div class="menu">
        <button class="add" id="addbtn" aria-haspopup="true" aria-label="Add a track" title="Add a track"><span class="lg">+ TRACK</span><span class="sm">+</span></button>
        <div class="menu-list" id="addmenu" hidden>
          <button id="add-synth">Synth <kbd>SLOOP · CLIPPER</kbd></button>
          <button id="add-drum">Drums <kbd>KITS</kbd></button>
          <button id="add-audio">Audio <kbd>FILES · MIC</kbd></button>
          <button id="add-sampler">Sampler <kbd>KEYS · SLICES</kbd></button>
          <button id="add-ext">External MIDI <kbd>FM-1 · HARDWARE</kbd></button>
          <button id="add-wam">Plugin instrument (WAM)… <kbd>WEB AUDIO MODULES</kbd></button>
          <button id="add-group">Group <kbd>BUS</kbd></button>
          <button id="add-vca">VCA fader <kbd>CONTROLS FADERS</kbd></button>
          <button id="add-preset">From a preset… <kbd>YOUR TRACKS</kbd></button>
          <hr>
          <button id="add-return">Return track <kbd>SEND FX</kbd></button>
          <button id="add-tempo">Tempo lane <kbd>TEMPO MAP</kbd></button>
          <button id="add-macros">Macro lane <kbd>MACROS</kbd></button>
        </div>
      </div>
    </div>
    <canvas id="ruler"></canvas>
    <div id="scene-bar" hidden></div>
    <div id="heads"><div id="heads-inner"></div></div>
    <div id="lanes"><canvas id="lanes-cv"></canvas><div id="session" hidden></div></div>
  </section>

  <section id="bot" class="panel" aria-label="Editors">
    <div id="resize" title="Drag: the panel's height · double-click: back to normal"></div>
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="edit">Clip</button>
      <button class="tab" data-tab="device"><span class="lg">Instrument</span><span class="sm">Sound</span></button>
      <button class="tab" data-tab="mixer">Mixer</button>
      <button class="tab" data-tab="keys">Keys</button>
      <button class="tab" data-tab="ctl"><span class="lg">Controllers</span><span class="sm">MIDI</span></button>
      <div class="tab-info" id="tab-info"></div>
    </div>
    <div class="view" id="v-edit"></div>
    <div class="view" id="v-device" hidden></div>
    <div class="view" id="v-mixer" hidden></div>
    <div class="view" id="v-ctl" hidden></div>
    <div class="view" id="v-keys" hidden></div>
  </section>

  <nav id="mnav" aria-label="Views">
    <button data-m="arr" class="on">TRACKS</button>
    <button data-m="bot">EDIT</button>
    <button data-m="keys">KEYS</button>
    <button data-m="lib">SOUNDS</button>
  </nav>

  <aside id="lib" class="panel" aria-label="Sound library">
    <div class="tabs">
      <button class="tab on" data-mode="type">Types</button>
      <button class="tab" data-mode="engine">Engines</button>
      <button class="tab" data-mode="kits">Kits</button>
      <button class="tab" data-mode="samples">Samples</button>
    </div>
    <input id="lib-search" placeholder="Search sounds…" spellcheck="false" aria-label="Search sounds">
    <div id="lib-list"></div>
    <div id="lib-foot"></div>
  </aside>
</div>
<div id="toast" hidden></div>
<div id="learn-banner" hidden></div>
<div id="save-banner" role="alert" hidden></div>
<input type="file" id="openfile" accept=".json,.zip,.sloopsong,.dawproject,application/json,application/zip" hidden>
<input type="file" id="sloopfile" hidden>
<input type="file" id="midifile" accept=".mid,.midi,audio/midi" hidden>
<input type="file" id="audiofile" accept="audio/*,.wav,.aif,.aiff,.mp3,.flac,.ogg,.m4a" multiple hidden>
<script type="module" src="js/main.js"></script>

</body>
</html>
